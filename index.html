<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eaf0f6" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flipper" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Flipper</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='11' y='2' width='10' height='6' rx='1' fill='%23e2504c'/><rect x='8' y='8' width='16' height='22' rx='4' fill='%239fd3ff'/></svg>"
    />
    <style>
      :root {
        /* The notch and rounded corners; custom properties so a test can set them. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh; /* the visible viewport: the browser's bars don't push the canvas */
        /* Same as the game background (theme.ts): the notch / home-indicator safe-area padding and
           the letterbox bars then blend in instead of showing a gray frame on iPhone. */
        background: #eaf0f6;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      /* The safe area: Phaser sizes the canvas to its parent's whole box, so the padding goes on a
         wrapper and the game's own container (#game) is the area inside it. */
      #safe {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
      #game {
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="safe"><div id="game"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
